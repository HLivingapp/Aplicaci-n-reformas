name: Demo en GitHub Pages

# Publica la versión de demostración (sin base de datos) en la rama gh-pages
on:
  push:
    branches: [main]
  # Cada día a las 6:00 (hora peninsular aprox.) para refrescar las subvenciones desde la BDNS
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Subvenciones desde la BDNS (si no responde, se publican los datos anteriores)
        run: node scripts/actualizar-subvenciones.mjs || true
      # Dominio propio (public/CNAME = reformamejor.es): la web va en la raíz, sin subcarpeta
      - run: ./scripts/exportar-demo.sh ""
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          single-commit: true
